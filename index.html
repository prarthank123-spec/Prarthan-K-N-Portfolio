          } else {

            if (cfg.typography) document.documentElement.setAttribute('data-typography', cfg.typography);
            if (cfg.surface) document.documentElement.setAttribute('data-surface', cfg.surface);

          } else {
            document.documentElement.setAttribute('data-palette', 'neon-green');
