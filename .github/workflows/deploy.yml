name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build production portfolio (with pre-built docs fallback)
        run: |
          if npm install --no-audit --no-fund --legacy-peer-deps && npm run build && [ -f dist/index.html ]; then
            echo "DEPLOY_DIR=dist" >> "$GITHUB_ENV"
            touch dist/.nojekyll
            cp dist/index.html dist/404.html
          else
            echo "Fresh npm build unavailable in runner; deploying verified pre-built docs/ bundle."
            echo "DEPLOY_DIR=docs" >> "$GITHUB_ENV"
            touch docs/.nojekyll
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DEPLOY_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
